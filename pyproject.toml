[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyCicero"
version = "1.1.0"
description = "Python implementation of Cicero (peak co-accessibility) with a QUIC graphical-lasso solver, peak-gene correlation and ROSE super-enhancer calling"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Timothy Woo" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<2",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3,<1.8",   # skggm uses as_float_array(force_all_finite=...), removed in 1.8
    "scanpy>=1.10",
    "anndata>=0.10",
    "umap-learn>=0.5",
    "skggm>=0.2.8",
    "tqdm>=4.60",
]

[project.optional-dependencies]
gpu = ["cupy-cuda12x>=13,<14"]   # GPU TruncatedSVD; GPU UMAP additionally needs RAPIDS cuML (conda)

[project.urls]
Homepage = "https://github.com/timwoo102/pyCicero"

[tool.setuptools]
packages = ["pyCicero"]
